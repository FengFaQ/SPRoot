# SPRoot 管理器 —— Gradle 属性
#
# AGP 9 默认启用「内置 Kotlin 支持」（bundled KGP 2.2.10）。本工程必须用 Kotlin 2.4.20
# 编译，因为 miuix 0.9.4 是以 Kotlin 2.4.20 编译发布的，Kotlin 元数据不向前兼容。
# 因此显式关闭 built-in Kotlin，走经典 kotlin-android 插件（KGP 2.4.20）。
# 参考 AGP 9 BooleanOption.BUILT_IN_KOTLIN（属性名 android.builtInKotlin）。
android.builtInKotlin=false
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# 关闭 configuration cache：CI 与本地命令行参数（-P）会改变输入，保持可预测
org.gradle.configuration-cache=false
