# SPRoot 管理器版本目录
#
# 版本矩阵全部经实证核实（非臆造）：
#   - miuix v0.9.4 仓库 gradle/libs.versions.toml：
#       agp=9.4.1  kotlin=2.4.20  CMP=1.12.0  activity=1.13.0  Gradle=9.7.1  JDK=21
#   - miuix-ui-android-0.9.4.aar 的 aar-metadata.properties：minCompileSdk=37（低于 37 构建失败）
#   - miuix-ui-android-0.9.4.pom/.module：依赖 org.jetbrains.compose.foundation:foundation:1.12.0
#     → Android 侧重定向 androidx.compose.foundation:foundation:1.12.0
#   - Compose BOM 2026.08.00 恰好把 ui/foundation/runtime 钉在 1.12.0（与 miuix 完全一致）
#   - Maven Central maven-metadata.xml：miuix latest=0.9.4（2026-09-20）
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.08.00"
androidx-activity = "1.13.0"
miuix = "0.9.4"

# SDK 常量（AGP 9 DSL 的 compileSdk { version = release(37) { minorApiLevel = 0 } }）
compile-sdk = "37"
compile-sdk-minor = "0"
target-sdk = "37"
min-sdk = "26"
build-tools = "37.0.0"

[libraries]
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
