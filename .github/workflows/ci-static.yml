# SPRoot 静态质量门禁（D7）
#
# 目的：v2 每次 push 都跑 quality/static/ 下的静态检查脚本（与 apk/apd/engine/licenses/release
# 五个工作流不重复：本工作流只做「源码静态一致性」，不构建任何产物、不下载 artifact）：
#   - check_licenses.py    许可标注漂移（LIC-DRIFT）
#   - check_error_codes.py 错误码表一致性（docs §6.1 ↔ Models.kt/ApdClient.kt）
#   - verify_patch.py --help  修补产物校验脚本自检（argparse 契约可用）
#
# 约定：三个脚本**必须存在且必须跑通**（缺失或退出码 != 0 → 本工作流红）。
name: ci-static

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]
  workflow_dispatch:

concurrency:
  group: ci-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax check (quality/static)
        run: |
          set -e
          [ -d quality/static ] || { echo "::error::quality/static 目录不存在"; exit 1; }
          python3 -m compileall -q quality/static
          echo "compileall OK"

      - name: check_licenses.py (LIC-DRIFT)
        run: |
          set -e
          [ -f quality/static/check_licenses.py ] || {
            echo "::error::quality/static/check_licenses.py 缺失（补丁链必须保留许可门禁）"; exit 1; }
          python3 quality/static/check_licenses.py
          echo "check_licenses.py PASS"

      - name: check_error_codes.py (G-04 错误码一致性)
        run: |
          set -e
          [ -f quality/static/check_error_codes.py ] || {
            echo "::error::quality/static/check_error_codes.py 缺失（错误码门禁不可缺）"; exit 1; }
          python3 quality/static/check_error_codes.py
          echo "check_error_codes.py PASS"

      - name: verify_patch.py --help (脚本自检)
        run: |
          set -e
          [ -f quality/static/verify_patch.py ] || {
            echo "::error::quality/static/verify_patch.py 缺失（产物校验器不可缺）"; exit 1; }
          python3 quality/static/verify_patch.py --help > /dev/null
          echo "verify_patch.py --help PASS"

      - name: Summary
        if: always()
        run: |
          echo "### ci-static 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in quality/static/*.py; do
            [ -f "$f" ] && echo "- \`$f\` ($(stat -c %s "$f") B)" >> "$GITHUB_STEP_SUMMARY"
          done
