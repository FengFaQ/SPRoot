# engine.yml — SPRoot SK 修补引擎 arm64 交叉编译与产物断言
#
# 依据：docs/NEW-DOC-02-修补引擎本地化方案.md §5
# 目的：根治旧链路「宿主 x86-64 ELF 冒充 Android 产物」的病根（见 NEW-DOC-03）。
#       本工作流是引擎产物的**唯一合法来源**：本地不产出交付物，产物一律从 CI artifacts 取。
#
# 产物：
#   skroot-engine-arm64/libskrootpatch.so       静态可执行（ELF ET_EXEC，AArch64）
#   skroot-engine-arm64/libskpatchjni.so        共享库 + JNI（AArch64，仅依赖系统 libc/libm/libdl）
#   skroot-engine-arm64/SHA256SUMS
#
# 断言（任一失败即红）：
#   1) file 显示 ARM aarch64
#   2) readelf -h e_machine = AArch64（0xB7）
#   3) 可执行形态无 PT_INTERP、无 NEEDED（静态，不依赖宿主 glibc）
#   4) PT_TLS p_align = 0x40（API<29 编出会 p_align=8 → bionic 启动 abort，实测见文档 §3.2）
#   5) qemu-user 执行契约：--help rc=0、缺参数 rc=101(E_USAGE)、输入不存在 rc=102(E_INPUT)、
#      rc!=0 时不得产出 --out（C1 §3 失败不落盘铁律）
#   6) 若仓库内存在 samples/meizu21/boot.img：跑通 unpack→patch→repack 全链并核对
#      kernel sha256（回归真实内核，防止引擎改动打穿实机）
name: engine-arm64

on:
  push:
    branches: [main, v2, 'feat/**']
    paths: ['engine/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**']
  workflow_dispatch:

concurrency:
  group: engine-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r27c
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          mkdir -p "$HOME/ndk" && unzip -q /tmp/ndk.zip -d "$HOME/ndk"
          echo "ANDROID_NDK_HOME=$HOME/ndk/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Install qemu (契约自检用；三层 fallback，全部失败即显式失败)
        # ubuntu-latest 的默认源里没有 qemu-user-static 包名（run 42486267958 报
        # "Package 'qemu-user-static' has no installation candidate"）。按序尝试：
        #   1) qemu-user（含 qemu-aarch64，静态产物无需 -L sysroot）
        #   2) qemu-user-static
        #   3) multiarch 预编译静态 qemu-aarch64-static
        #
        # BUG-QA-5（2026-11-12 审计）：旧版本步 continue-on-error: true —— 对
        # 「apt 源暂时故障」与「真没有 qemu」不做区分，apt 故障时契约自检整代
        # 静默 SKIP 而 CI 全绿（正是"门禁存在但没执行"的事故形态）。现改为
        # **无 continue-on-error**：三层 fallback 最后必须 `command -v` 成功，
        # 否则 exit 1 显式红。理由：qemu 是本 workflow 唯一能抓"修补成功但
        # 内核跑飞"的运行时契约环节（ELF 断言只比头、asm oracle 只比字节），
        # 它的缺失应当红得可见，而不是被 continue-on-error 吞成静默跳过。
        # 若确需在无 qemu 环境跑（极端情况），契约步会写 qemu_contract=SKIPPED
        # 到 step summary（见下一步），人工可审计——但安装失败本身仍然红。
        run: |
          set -uo pipefail
          sudo apt-get update -o Acquire::Retries=3 || true
          if sudo apt-get install -y --no-install-recommends qemu-user; then
            echo "installed qemu-user"
          elif sudo apt-get install -y --no-install-recommends qemu-user-static; then
            echo "installed qemu-user-static"
          else
            echo "apt 均失败，回落 multiarch 静态二进制"
            curl -sSL -o /tmp/qemu-aarch64-static \
              https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-aarch64-static || true
            sudo install -m 0755 /tmp/qemu-aarch64-static /usr/local/bin/qemu-aarch64-static 2>/dev/null || true
          fi
          # 三层 fallback 后必须真的有 qemu 可用，否则显式失败（不静默）
          command -v qemu-aarch64-static || command -v qemu-aarch64 || {
            echo "::error::三层 fallback 后仍无 qemu-aarch64（契约自检无法进行）"; exit 1
          }

      - name: Build arm64 artifacts (exec + JNI)
        run: bash engine/android/build_arm64.sh both

      - name: ELF assertions — 架构/静态性/TLS 对齐（防宿主 x86-64 回归）
        run: |
          set -euo pipefail
          E=engine/android/build/arm64/exec/skroot-patch
          J=engine/android/build/arm64/jni/libskrootpatch.so
          for f in "$E" "$J"; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
            file "$f" | grep -q 'ARM aarch64' || { echo "NOT AArch64: $f"; exit 1; }
            readelf -h "$f" | grep -q 'AArch64'      || { echo "e_machine != AArch64: $f"; exit 1; }
            test -x "$f"                              || { echo "not executable: $f"; exit 1; }
          done
          # 静态可执行：无宿主动态解释器、无 NEEDED
          ! readelf -lW "$E" | grep -q INTERP  || { echo "has PT_INTERP (宿主 glibc 解释器)"; exit 1; }
          ! readelf -dW "$E" | grep -q NEEDED  || { echo "has NEEDED (非静态)"; exit 1; }
          # TLS 对齐（API>=29 才为 0x40）
          test "$(readelf -lW "$E" | awk '/TLS/{print $NF}')" = "0x40" || { echo "PT_TLS p_align != 0x40"; exit 1; }
          # JNI 只允许系统库
          bad="$(readelf -dW "$J" | grep NEEDED | grep -vE 'libc\.so|libm\.so|libdl\.so|liblog\.so' || true)"
          test -z "$bad" || { echo "JNI 存在非系统依赖: $bad"; exit 1; }

      - name: Contract assertions (qemu-user 真实执行 arm64 产物)
        id: contract
        run: |
          set -euo pipefail
          E=engine/android/build/arm64/exec/skroot-patch
          Q="$(command -v qemu-aarch64-static || command -v qemu-aarch64 || true)"
          if [ -z "$Q" ]; then
            # BUG-QA-5：SKIPPED 必须显式可见（输出 + step summary），
            # 由本 workflow 末尾的 sentinel 步骤消费；不允许静默 SKIP。
            echo "qemu_contract=SKIPPED" >> "$GITHUB_OUTPUT"
            echo "::warning::qemu 不可用，跳过运行时契约自检（ELF 架构断言已在上一 step 通过）"
            echo "## ⚠️ 运行时契约自检 SKIPPED：本 step 未执行（qemu 缺失）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "qemu_contract=RAN" >> "$GITHUB_OUTPUT"
          # 说明：本步全篇 set -euo pipefail；所有"预期失败"的调用统一用
          #   rc=0; cmd ... || rc=$?
          # 硬编码 expected-rc 断言。**不要**用 `cmd; rc=$?`（set -e 下会直接中止整步，
          # run 42489595614 即因 key-abi 的 101 把契约步判红而失败）。
          $Q "$E" --help > /tmp/help.txt 2>&1 || { echo "--help 执行失败"; exit 1; }
          grep -q 'SPRoot patch engine' /tmp/help.txt || { echo "--help 缺少 engine banner"; exit 1; }
          rc=0; $Q "$E" >/dev/null 2>&1 || rc=$?
          test $rc -eq 101 || { echo "E_USAGE rc=$rc"; exit 1; }
          rm -f /tmp/noout.img
          rc=0; $Q "$E" --in /tmp/__missing__ --out /tmp/noout.img --gen-key >/dev/null 2>&1 || rc=$?
          test $rc -eq 102 || { echo "E_INPUT rc=$rc"; exit 1; }
          test ! -e /tmp/noout.img || { echo "失败却产出 --out（违反 C1 §3 铁律）"; exit 1; }
          # P0：非 47+NUL 的 key ABI 必须被拒（Skroot-Next 的 48-no-NUL 不兼容）
          rm -f /tmp/kabi.img
          rc=0; $Q "$E" --in /tmp/__missing__ --out /tmp/kabi.img --key ABCdef0123456789ABCdef0123456789ABCdef0123456789 --key-abi 48nul >/tmp/kabi.log 2>&1 || rc=$?
          test $rc -eq 101 || { echo "key-abi 非 47nul 未被拒绝 rc=$rc"; exit 1; }
          grep -q 'INCOMPATIBLE' /tmp/kabi.log || { echo "key-abi 拒绝信息缺少不兼容说明"; exit 1; }
          test ! -e /tmp/kabi.img || { echo "key-abi 拒绝后仍产出 --out"; exit 1; }
          echo "qemu contract: 101/102 + no-output-on-failure + key-abi guard OK"

      - name: JNI 符号与客户端包名对齐断言（防 UnsatisfiedLinkError）
        # 客户端类：me.sproot.patch.NativeEngine（object，@JvmStatic external fun）
        # → JNI 符号必须严格为 Java_me_sproot_patch_NativeEngine_<method>
        run: |
          set -euo pipefail
          J=engine/android/build/arm64/jni/libskrootpatch.so
          NM=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm)
          SYMS=$("$NM" -D --defined-only "$J" | awk '{print $3}' | grep '^Java_' | sort)
          echo "$SYMS"
          echo "$SYMS" | grep -qx 'Java_me_sproot_patch_NativeEngine_patch'
          echo "$SYMS" | grep -qx 'Java_me_sproot_patch_NativeEngine_engineVersion'
          # 不能残留旧 ABI 符号（旧命名/旧包名）
          ! echo "$SYMS" | grep -q 'Java_com_sproot_manager'
          echo "JNI symbols OK: me.sproot.patch.NativeEngine {patch, engineVersion}"

      - name: asm oracle（asmjit 字节 vs NDK LLVM 汇编器，逐字节比对）
        # 防止 asmjit 版本/参数变化导致跳板字节悄悄改变（修补"成功"但内核跑飞）
        run: |
          set -euo pipefail
          LOG=$(bash engine/android/tools/asm_oracle.sh 29 2>&1 | tee /dev/stderr)
          echo "$LOG" | grep -q 'asm oracle: PASS=' || { echo "asm oracle 未产出结果"; exit 1; }
          echo "$LOG" | grep -q 'FAIL=0' || { echo "asm oracle 存在不一致"; exit 1; }
          CASES=$(echo "$LOG" | grep -c '^PASS ')
          META=engine/android/build/arm64/ENGINE-META.txt
          { echo "asm_oracle=PASS"; echo "asm_oracle_cases=$CASES"; echo "asm_oracle_toolchain=llvm-as-via-ndk-clang+llvm-objdump"; } >> "$META"
          cat "$META" | tail -4

      - name: T-12 强断言（合成 bootimg，无需样本，必跑）
        # 强判据：repack 后回读 kernel 段 sha256 必须 == patch 输出 sha256（不是只比长度）。
        # verify_artifact.sh 的 A7 段用合成 boot.img 覆盖这条回归；此处断言其 PASS 文本。
        run: |
          set -euo pipefail
          LOG=$(bash engine/android/verify_artifact.sh 2>&1 | tee /dev/stderr)
          echo "$LOG" | grep -q 'PASS  A7b' || { echo "T-12 强断言未通过"; exit 1; }
          echo "$LOG" | grep -q 'RESULT: ALL PASS' || { echo "verify_artifact 存在失败项"; exit 1; }

      - name: Bootimg chain regression（有样本才跑）
        if: hashFiles('samples/meizu21/boot.img') != ''
        run: |
          set -euo pipefail
          E=engine/android/build/arm64/exec/skroot-patch
          Q="$(command -v qemu-aarch64-static || command -v qemu-aarch64 || true)"
          if [ -z "$Q" ]; then
            echo "::warning::qemu 不可用，跳过运行时契约自检（ELF 架构断言已在上一 step 通过）"
            exit 0
          fi
          WORK=$(mktemp -d)
          $Q "$E" --bootimg info --in samples/meizu21/boot.img | tee "$WORK/info.txt"
          grep -q 'header_version=4' "$WORK/info.txt"
          grep -q 'compression=raw'  "$WORK/info.txt"
          grep -q 'kernel: offset=4096 size=33892864' "$WORK/info.txt"
          $Q "$E" --bootimg extract-kernel --in samples/meizu21/boot.img --out "$WORK/kernel"
          echo "4d445384c046f2ba2de856b3215de8d2be83a9ccad115948a34471cde3098481  $WORK/kernel" | sha256sum -c -
          KEY=ABCdef0123456789ABCdef0123456789ABCdef0123456789
          $Q "$E" --in "$WORK/kernel" --out "$WORK/kernel.patched" --key "$KEY" --json "$WORK/ev.ndjson" --workdir "$WORK/w"
          test "$(stat -c%s "$WORK/kernel")" = "$(stat -c%s "$WORK/kernel.patched")"
          $Q "$E" --bootimg repack --in samples/meizu21/boot.img --kernel "$WORK/kernel.patched" --out "$WORK/new-boot.img"
          test "$(stat -c%s "$WORK/new-boot.img")" = "$(stat -c%s samples/meizu21/boot.img)"
          echo "bootimg chain OK: kernel 等长 + boot.img 等长"

      - name: magiskboot ARM64（SKRoot 官方打包工具，固定版本 + 哈希断言）
        run: |
          set -euo pipefail
          MK_VER=v31.1
          MK_APK=Magisk-v31.1.apk
          MK_APK_SHA=89cefac0a318afa39fb3880c45c87b036c05bc1ebf02a7a715b7f8d7c26ac6e7
          MK_BIN_SHA=97e9ec75731103d31c9e1effca7a50c6444309ce8f78c2ec27e9fe721da4bb54
          curl -sSL -o "$MK_APK" "https://github.com/topjohnwu/Magisk/releases/download/${MK_VER}/${MK_APK}"
          echo "${MK_APK_SHA}  ${MK_APK}" | sha256sum -c -
          mkdir -p dist
          unzip -o -j "$MK_APK" "lib/arm64-v8a/libmagiskboot.so" -d dist/
          mv dist/libmagiskboot.so dist/magiskboot
          chmod 0755 dist/magiskboot
          file dist/magiskboot | grep -q 'ARM aarch64'
          readelf -h dist/magiskboot | grep -q 'AArch64'
          echo "${MK_BIN_SHA}  dist/magiskboot" | sha256sum -c -
          printf 'magisk_version=%s\nmagisk_apk=%s\nmagisk_apk_sha256=%s\nmagiskboot_sha256=%s\nsource=%s\nnote=GPL-3.0 aggregate; see NOTICE\n' \
            "$MK_VER" "$MK_APK" "$MK_APK_SHA" "$MK_BIN_SHA" \
            "https://github.com/topjohnwu/Magisk/releases/download/${MK_VER}/${MK_APK}" > dist/magiskboot-meta.txt
          cat dist/magiskboot-meta.txt

      - name: Stage artifacts + checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          cp engine/android/build/arm64/exec/skroot-patch      out/
          cp engine/android/build/arm64/jni/libskrootpatch.so  out/
          cp engine/android/build/arm64/ENGINE-META.txt        out/
          cp engine/android/build/arm64/SYMBOLS-libskrootpatch.txt out/ 2>/dev/null || true
          if [ -f dist/magiskboot ]; then cp dist/magiskboot out/; fi
          if [ -f dist/magiskboot-meta.txt ]; then cp dist/magiskboot-meta.txt out/; fi
          (cd out && sha256sum $(ls | grep -v '^SHA256SUMS$') | sort -k2 > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skroot-engine-arm64
          path: out/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magiskboot-arm64
          path: |
            dist/magiskboot
            dist/magiskboot-meta.txt
          retention-days: 30

      # BUG-QA-5 哨兵步：契约自检 SKIPPED 必须在 job 结论里显式可见。
      # 选择「success + summary 供人审」而非「连续 SKIP 即红」：SKIPPED 的根因
      # 已被上一步的显式 exit 1 挡住（三层 fallback 失败 = job 红），能走到
      # 这里的 SKIPPED 只剩"安装成功但 command -v 意外为空"的罕见态，红整套
      # 构建的代价（阻断 artifact 产出、阻塞 APK/release 链）与其信息量不成
      # 比例；summary + warning 足以让人审发现并追溯。若未来 SKIPPED 连续
      # 出现，应优先修环境而不是把门禁改红。
      - name: Contract sentinel — SKIPPED 必须显式可见
        if: always()
        run: |
          V="${{ steps.contract.outputs.qemu_contract }}"
          echo "qemu_contract=${V:-UNKNOWN}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${V:-}" != "RAN" ]; then
            echo "::warning::本代运行时契约自检未执行（qemu_contract=${V:-UNKNOWN}）——ELF 架构断言已过，但 rc=101/102/key-abi 等运行时契约未验证，请在 summary 中人工确认"
          fi
