# SPRoot AP binary (apd/, Rust) CI — v2 layout.
#
# Project rule: NO local cross-compilation; every arm64 artifact is built here
# on GitHub Actions. Locally only `cargo check` is allowed as a fast syntax gate
# (never a deliverable, never an arm64 binary).
#
# Produces dist/libapd.so (aarch64 PIE executable; packaged into the APK's
# jniLibs/arm64-v8a and executed from nativeLibraryDir), asserts the ELF header
# is EM_AARCH64 + ET_DYN, and uploads artifact + sha256.

name: apd (Rust, aarch64-android)

on:
  push:
    branches: [v2]
    paths:
      - "apd/**"
      - ".github/workflows/apd.yml"
  pull_request:
    branches: [v2]
    paths:
      - "apd/**"
      - ".github/workflows/apd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apd:
    name: build libapd.so (aarch64-linux-android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust toolchain + cross target (edition 2024 needs a recent stable).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          key: apd-aarch64

      # Android NDK provides the clang linker + sysroot for the target.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure cross linker / C compiler
        run: |
          set -euo pipefail
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${NDK_BIN}/aarch64-linux-android24-clang"
          if [ ! -x "$CC" ]; then
            echo "toolchain missing: $CC"; ls "$NDK_BIN"; exit 1
          fi
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${CC}"
            echo "CC_aarch64_linux_android=${CC}"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${NDK_BIN}/llvm-ranlib"
            echo "STRIP_aarch64_linux_android=${NDK_BIN}/llvm-strip"
          } >> "$GITHUB_ENV"

      # Fast syntax gate on the host first, so a typo fails in seconds.
      - name: Host syntax check
        run: cargo check --locked

      # Real deliverable: cross-compiled release binary for arm64 Android.
      - name: Cross build (release)
        run: cargo build --release --locked --target aarch64-linux-android

      - name: Stage artifact as libapd.so (+ fixed-name copy + version manifest)
        run: |
          set -euo pipefail
          mkdir -p ../dist
          SRC="target/aarch64-linux-android/release/apd"
          test -f "$SRC"
          cp "$SRC" ../dist/libapd.so
          # Size attribution (qa asks "why did the binary shrink?"): symbol sizes
          # BEFORE strip (strip removes the table), section sizes AFTER strip.
          NDK_TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_TOOLCHAIN/llvm-nm" --size-sort --print-size "$SRC" 2>/dev/null | tail -40 > ../dist/apd-size-symbols.txt || true
          "${STRIP_aarch64_linux_android}" ../dist/libapd.so
          "$NDK_TOOLCHAIN/llvm-size" -A ../dist/libapd.so > ../dist/apd-size-sections.txt
          "$NDK_TOOLCHAIN/llvm-size" ../dist/libapd.so | tee -a ../dist/apd-size-sections.txt
          # Fixed-name copy for the app CI: download this artifact and put it in
          # newapp/app/src/main/jniLibs/arm64-v8a/libapd.so (version pinned by
          # apd-version.txt).
          cp ../dist/libapd.so ../dist/libapd-arm64.so
          ls -l ../dist/libapd.so
          ( cd ../dist && sha256sum libapd.so | tee libapd.so.sha256 )
          file ../dist/libapd.so | tee ../dist/libapd.elf-info.txt
          # Version manifest: the manager compares this against the deployed
          # /data/adb/apd (`apd version --json` -> commit field) to detect skew.
          digest=$(sha256sum ../dist/libapd.so | cut -d' ' -f1)
          size=$(stat -c%s ../dist/libapd.so)
          version=$(git describe --tags --always 2>/dev/null || echo 0.0.0)
          commit_short=$(git rev-parse --short=12 HEAD)
          {
            echo "name=apd"
            echo "version=${version}"
            echo "commit=${GITHUB_SHA}"
            echo "commit_short=${commit_short}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "size_bytes=${size}"
            echo "sha256=${digest}"
          } > ../dist/apd-version.txt
          cat ../dist/apd-version.txt

      # ELF assertion: ELFCLASS64 + little-endian + ET_DYN (PIE) + EM_AARCH64.
      - name: Assert ELF is aarch64 PIE
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct

          path = "../dist/libapd.so"
          with open(path, "rb") as f:
              ident = f.read(20)

          assert ident[:4] == b"\x7fELF", "not an ELF file"
          ei_class, ei_data = ident[4], ident[5]
          e_type, e_machine = struct.unpack("<HH", ident[16:20])
          print(f"class={ei_class} data={ei_data} e_type={e_type} e_machine={e_machine}")

          assert ei_class == 2, "not ELFCLASS64"
          assert ei_data == 1, "not little-endian"
          assert e_type == 3, "not ET_DYN (PIE executable expected)"
          assert e_machine == 183, "not EM_AARCH64 (183)"
          print("ELF assertion passed: aarch64 PIE")
          PY

      # Feature-presence gate: the size work (P1 dep removal + P2 opt-level=z)
      # must never silently drop a capability. Markers are static strings that
      # only exist when the corresponding code path is compiled in.
      - name: Capability assertions (no feature loss from size work)
        run: |
          set -euo pipefail
          F=../dist/libapd.so
          markers=(
            daemon deploy undeploy root-exec selftest auth version
            vbmeta_untouched SPROOT_REQUEST_UID /proc/self/attr/current
            sproot- allow_list boot_count safemode module
          )
          : > ../dist/apd-capabilities.txt
          for m in "${markers[@]}"; do
            if grep -aq -- "$m" "$F"; then
              echo "OK   $m" >> ../dist/apd-capabilities.txt
            else
              echo "MISS $m" >> ../dist/apd-capabilities.txt
              echo "MISSING CAPABILITY MARKER: $m"
              cat ../dist/apd-capabilities.txt
              exit 1
            fi
          done
          cat ../dist/apd-capabilities.txt

      # Per-commit artifact (immutable, keeps history in the UI).
      - name: Upload artifact (commit-pinned)
        uses: actions/upload-artifact@v4
        with:
          name: apd-aarch64-${{ github.sha }}
          path: |
            dist/libapd.so
            dist/libapd.so.sha256
            dist/libapd.elf-info.txt
            dist/apd-version.txt
            dist/apd-size-sections.txt
            dist/apd-size-symbols.txt
            dist/apd-capabilities.txt
          if-no-files-found: error
          retention-days: 14

      # Fixed-name artifact for the app CI: stable download path + manifest.
      # Client usage: gh run download -n apd-aarch64-latest -R FengFaQ/SPRoot
      - name: Upload artifact (fixed name for app CI)
        uses: actions/upload-artifact@v4
        with:
          name: apd-aarch64-latest
          path: |
            dist/libapd-arm64.so
            dist/apd-version.txt
            dist/apd-size-sections.txt
            dist/apd-size-symbols.txt
            dist/apd-capabilities.txt
          if-no-files-found: error
          retention-days: 30
