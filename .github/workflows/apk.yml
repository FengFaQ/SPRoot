name: Build SPRoot Manager APK

on:
  push:
    branches: [ "v2" ]
    paths:
      - 'app/**'
      - '*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'keystore/**'
      - 'app/src/**'
      # rc 自启模板从 apd/assets 现拷（apd/assets/init.sproot.rc），
      # 不纳入触发路径会导致模板更新后 APK 不重建、静默发出旧模板。
      - 'apd/assets/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Fetch pinned native libs (app/native.lock.json, reproducible)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a
          ASSETS=app/src/main/assets
          mkdir -p "$DEST" "$ASSETS"
          LOCK=app/native.lock.json
          [ -f "$LOCK" ] || { echo "::error::缺少 $LOCK（可复现构建必需）"; exit 1; }
          echo "--- native.lock.json ---"; cat "$LOCK"

          lock() { python3 -c "import json;d=json.load(open('$LOCK'))['$1'];print(d.get('$2',''))"; }

          fetch_run_artifact() { # $1=run_id $2=artifact name $3=outdir
            rid="$1"; name="$2"; out="$3"
            id=$(gh api "/repos/${{ github.repository }}/actions/runs/$rid/artifacts?per_page=100" \
                  --jq ".artifacts[] | select(.name==\"$name\") | .id" 2>/dev/null | head -1)
            if [ -z "${id:-}" ]; then echo "::error::run $rid 中找不到 artifact $name"; return 1; fi
            mkdir -p "$out"
            gh api "/repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$out.zip"
            unzip -o -q "$out.zip" -d "$out"
            echo "downloaded $name (run $rid, artifact id $id)"
          }

          verify_file() { # $1=file $2=expected sha256 $3=label
            [ -f "$1" ] || { echo "::error::$3 文件不存在：$1"; exit 1; }
            got=$(sha256sum "$1" | cut -d' ' -f1)
            size=$(stat -c %s "$1")
            if [ "$got" != "$2" ]; then
              echo "::error::$3 sha256 不匹配：锁定=$2 实际=$got（产物与被锁定的 run 不一致，禁止出包）"
              exit 1
            fi
            echo "OK $3 sha256=$got size=$size（与 native.lock.json 一致）"
          }

          # ---- engine (JNI) ----
          E=/tmp/pin-engine
          fetch_run_artifact "$(lock engine run_id)" "$(lock engine artifact)" "$E"
          verify_file "$E/$(lock engine file)" "$(lock engine sha256)" "engine JNI"
          cp -f "$E/$(lock engine file)" "$DEST/$(lock engine target)"
          # 校验材料随包
          for m in ENGINE-META.txt SYMBOLS-libskrootpatch.txt SHA256SUMS; do
            [ -f "$E/$m" ] && cp -f "$E/$m" "$ASSETS/$m" || echo "::warning::engine artifact 缺 $m"
          done

          # ---- apd ----
          A=/tmp/pin-apd
          fetch_run_artifact "$(lock apd run_id)" "$(lock apd artifact)" "$A"
          verify_file "$A/$(lock apd file)" "$(lock apd sha256)" "apd"
          cp -f "$A/$(lock apd file)" "$DEST/$(lock apd target)"
          for m in apd-version.txt apd-capabilities.txt; do
            [ -f "$A/$m" ] && cp -f "$A/$m" "$ASSETS/$m" || echo "::warning::apd artifact 缺 $m"
          done

          # ---- magiskboot ----
          M=/tmp/pin-mb
          fetch_run_artifact "$(lock magiskboot run_id)" "$(lock magiskboot artifact)" "$M"
          verify_file "$M/$(lock magiskboot file)" "$(lock magiskboot sha256)" "magiskboot"
          cp -f "$M/$(lock magiskboot file)" "$DEST/$(lock magiskboot target)"
          [ -f "$M/magiskboot-meta.txt" ] && cp -f "$M/magiskboot-meta.txt" "$ASSETS/magiskboot-meta.txt"

          echo "--- jniLibs ---"; ls -la "$DEST"
          for f in "$DEST"/*.so; do
            file "$f"
            MACHINE=$(od -An -tu2 -j18 -N2 "$f" | tr -d ' ')
            [ "$MACHINE" = "183" ] || { echo "::error::$(basename "$f") 非 AArch64 (machine=$MACHINE)"; exit 1; }
          done
          sha256sum "$DEST"/*.so

      - name: Copy authoritative rc template into APK assets
        run: |
          set -eu
          SRC=apd/assets/init.sproot.rc
          DEST=app/src/main/assets/init.sproot.rc
          if [ ! -f "$SRC" ]; then echo "::error::缺少权威 rc 模板 $SRC"; exit 1; fi
          mkdir -p app/src/main/assets
          cp -f "$SRC" "$DEST"
          echo "rc template copied: $(stat -c %s "$DEST") bytes"
          grep -q "service sproot-apd" "$DEST" || { echo "::error::rc 模板缺 service sproot-apd"; exit 1; }
          grep -q "sys.boot_completed" "$DEST" || { echo "::error::rc 模板缺 boot_completed 触发器"; exit 1; }
          grep -q "oneshot" "$DEST" || { echo "::error::rc 模板缺 oneshot（防 bootloop）"; exit 1; }
          grep -q "disabled" "$DEST" || { echo "::error::rc 模板缺 disabled（防 bootloop）"; exit 1; }
          echo "rc template content checks OK"

      - name: Assemble NOTICE assets (single source of truth)
        run: |
          set -eu
          A=app/src/main/assets
          mkdir -p "$A/licenses"
          {
            echo "# SPRoot Manager APK — 第三方声明（与仓库根 NOTICE 同源）"
            echo
            cat NOTICE
            echo
            echo "---"
            echo
            cat "$A/NOTICE-APK.md"
          } > "$A/NOTICE"
          cp -f LICENSE "$A/licenses/AGPL-3.0.txt"
          cp -f "$A/licenses/AGPL-3.0.txt" "$A/licenses/LICENSE"
          cp -f "$A/NOTICE" "$A/licenses/NOTICE"
          # 发布门禁要求的必备字样自检（缺一即构建失败）
          NOTICE_FILE="$A/NOTICE"
          for phrase in "SKRoot" "All Rights Reserved" "保留所有权利" "AGPL-3.0" "GPL-3.0" "magiskboot" "asmjit" "capstone" "cJSON"; do
            if grep -q "$phrase" "$NOTICE_FILE"; then
              echo "NOTICE phrase OK: $phrase"
            else
              echo "::error::NOTICE 缺少必备声明字样：$phrase"; exit 1
            fi
          done
          echo "--- assets ---"; ls -la "$A" "$A/licenses"
          echo "NOTICE bytes=$(stat -c %s "$A/NOTICE")"

      - name: Build release APK
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp }}
        run: |
          # T8（产物可复现）：把 commit 时间固定为构建时间基准；
          # native 字节一致由 app/native.lock.json 保证；APK 采用 qa 的「逐条目内容一致」容差判定。
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -20

      - name: Inspect APK native libs (info only)
        if: always()
        run: |
          unzip -l app/build/outputs/apk/release/*.apk | grep -E "lib/arm64-v8a|extractNativeLibs" || true
          unzip -l app/build/outputs/apk/release/*.apk | grep "lib/arm64-v8a" || echo "WARN: APK 内暂无 jniLibs（等 engine/apd artifact 就绪）"

      - name: Assert APK contains required AArch64 natives
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a" || true
          MISSING=0
          for lib in libskrootpatch.so libmagiskboot.so libapd.so; do
            if unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib"; then
              unzip -p "$APK" "lib/arm64-v8a/$lib" > "/tmp/$lib"
              MACHINE=$(od -An -tu2 -j18 -N2 "/tmp/$lib" | tr -d ' ')
              SIZE=$(stat -c %s "/tmp/$lib")
              SHA=$(sha256sum "/tmp/$lib" | cut -d' ' -f1)
              echo "OK $lib  size=$SIZE  sha256=$SHA  elf_machine=$MACHINE"
              if [ "$MACHINE" != "183" ]; then echo "::error::$lib 不是 AArch64 ELF"; exit 1; fi
            else
              echo "::error::APK 缺少 lib/arm64-v8a/$lib（native 集成未完成，禁止出包）"
              MISSING=1
            fi
          done
          if [ "$MISSING" != "0" ]; then exit 1; fi
          # libskrootpatch.so 必须是 JNI 共享库（ET_DYN），不能是 CLI 可执行文件
          if file /tmp/libskrootpatch.so | grep -q "shared object"; then
            echo "OK libskrootpatch.so is a shared object (ET_DYN)"
          else
            echo "::error::libskrootpatch.so 不是共享库（可能误放 CLI 可执行文件）"; exit 1
          fi
          # JNI ABI 断言：必须导出 me.sproot.patch.NativeEngine 的两个符号
          if command -v nm >/dev/null 2>&1; then
            if nm -D --defined-only /tmp/libskrootpatch.so | grep -q "Java_me_sproot_patch_NativeEngine_patch"; then
              echo "OK JNI symbol patch"
            else
              echo "::error::libskrootpatch.so 缺少 Java_me_sproot_patch_NativeEngine_patch"; exit 1
            fi
            if nm -D --defined-only /tmp/libskrootpatch.so | grep -q "Java_me_sproot_patch_NativeEngine_engineVersion"; then
              echo "OK JNI symbol engineVersion"
            else
              echo "::error::libskrootpatch.so 缺少 Java_me_sproot_patch_NativeEngine_engineVersion"; exit 1
            fi
          else
            echo "::warning::nm 不可用，跳过 JNI 符号断言"
          fi
          # 作废旧名不得出现在 APK
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libskpatchjni.so"; then
            echo "::error::APK 内出现已作废的 libskpatchjni.so"; exit 1
          fi
          # NOTICE / 许可证断言：第三方声明与 GPL-3.0、AGPL-3.0 全文必须随包
          for asset in assets/NOTICE assets/init.sproot.rc assets/licenses/NOTICE assets/licenses/LICENSE assets/licenses/GPL-3.0.txt assets/licenses/AGPL-3.0.txt assets/NOTICE-APK.md; do
            if unzip -l "$APK" | grep -q "$asset"; then
              echo "OK $asset present"
            else
              echo "::error::APK 缺少 $asset（第三方声明/许可证文本缺失）"; exit 1
            fi
          done
          NOTICE_TMP=/tmp/notice-from-apk.txt
          unzip -p "$APK" assets/NOTICE > "$NOTICE_TMP"
          for phrase in "SKRoot" "All Rights Reserved" "AGPL-3.0" "GPL-3.0" "magiskboot"; do
            grep -q "$phrase" "$NOTICE_TMP" \
              && echo "OK NOTICE(from APK) contains: $phrase" \
              || { echo "::error::APK 的 assets/NOTICE 缺少字样：$phrase"; exit 1; }
          done
          # AGPL-3.0 全文断言（LICENSE 应显著大于 20KB 且含 AGPL 标题）
          unzip -p "$APK" assets/licenses/LICENSE > /tmp/license-from-apk.txt
          SIZE=$(stat -c %s /tmp/license-from-apk.txt)
          [ "$SIZE" -gt 20000 ] && echo "OK AGPL full text size=$SIZE" \
            || { echo "::error::assets/licenses/LICENSE 过小（$SIZE B），疑似非全文"; exit 1; }
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" /tmp/license-from-apk.txt \
            && echo "OK AGPL header present" \
            || { echo "::error::LICENSE 缺 AGPL 标题"; exit 1; }
          # extractNativeLibs 断言（Android 需解压 nativeLibraryDir 才能 exec magiskboot/apd）
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "extractNativeLibs" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPRoot-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
