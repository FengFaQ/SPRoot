name: Build SPRoot Manager APK

on:
  push:
    branches: [ "v2" ]
    paths:
      - 'app/**'
      - '*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'keystore/**'
      - 'app/src/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Fetch native libs from CI artifacts (optional, non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -u
          DEST=app/src/main/jniLibs/arm64-v8a
          ASSETS=app/src/main/assets
          mkdir -p "$DEST" "$ASSETS"
          fetch_art() {
            name="$1"; destname="$2"
            id=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=1" --jq '.artifacts[0].id // empty' 2>/dev/null || true)
            if [ -z "${id:-}" ]; then echo "SKIP $name (artifact 不存在)"; return 0; fi
            D=$(mktemp -d)
            if ! gh api "/repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$D.zip" 2>/dev/null; then
              echo "SKIP $name (下载失败)"; return 0
            fi
            if ! unzip -o -q "$D.zip" -d "$D"; then echo "SKIP $name (解压失败)"; return 0; fi
            f=$(find "$D" -type f -name '*.so' | head -1)
            if [ -z "${f:-}" ]; then echo "SKIP $name (无 .so)"; find "$D" -type f | head -5; return 0; fi
            cp -f "$f" "$DEST/$destname"
            echo "OK $name -> $destname ($(stat -c %s "$DEST/$destname") bytes)"
            vf=$(find "$D" -type f -name '*version*.txt' | head -1)
            if [ -n "${vf:-}" ]; then cp -f "$vf" "$ASSETS/apd-version.txt"; echo "OK version file -> assets/apd-version.txt"; fi
          }
          fetch_art apd-aarch64-latest libapd.so
          echo "--- 引擎 artifact 名称待 patcher 确认，先按候选名尝试（缺失不阻断） ---"
          fetch_art skrootpatch-aarch64 libskrootpatch.so
          fetch_art engine-aarch64-latest libskrootpatch.so
          fetch_art engine-arm64 libskrootpatch.so
          echo "--- jniLibs ---"; ls -la "$DEST" || true
          for f in "$DEST"/*.so; do [ -f "$f" ] && file "$f" && head -c 20 "$f" | od -An -tx1 | head -1; done || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -20

      - name: Inspect APK native libs (info only)
        if: always()
        run: |
          unzip -l app/build/outputs/apk/release/*.apk | grep -E "lib/arm64-v8a|extractNativeLibs" || true
          unzip -l app/build/outputs/apk/release/*.apk | grep "lib/arm64-v8a" || echo "WARN: APK 内暂无 jniLibs（等 engine/apd artifact 就绪）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPRoot-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
