name: Build SPRoot Manager APK

on:
  push:
    branches: [ "v2" ]
    paths:
      - 'app/**'
      - '*.kts'
      - 'gradle/**'
      - 'keystore/**'
      - 'app/src/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPRoot-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
