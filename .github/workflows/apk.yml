name: Build SPRoot Manager APK

on:
  push:
    branches: [ "v2" ]
    paths:
      - 'app/**'
      - '*.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'keystore/**'
      - 'app/src/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - name: Fetch native libs from CI artifacts (optional, non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -u
          DEST=app/src/main/jniLibs/arm64-v8a
          ASSETS=app/src/main/assets
          mkdir -p "$DEST" "$ASSETS"

          fetch_to() { # $1=artifact name $2=dest dir
            name="$1"; out="$2"
            id=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=1"                   --jq '.artifacts[0].id // empty' 2>/dev/null || true)
            if [ -z "${id:-}" ]; then echo "SKIP $name (artifact 不存在)"; return 1; fi
            if ! gh api "/repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/$name.zip" 2>/dev/null; then
              echo "SKIP $name (下载失败)"; return 1
            fi
            mkdir -p "$out"
            unzip -o -q "/tmp/$name.zip" -d "$out" || { echo "SKIP $name (解压失败)"; return 1; }
            echo "OK $name -> $out"
            return 0
          }

          # 1) 引擎 + magiskboot（patcher 的 engine CI：libskrootpatch.so(JNI) / magiskboot / ENGINE-META / SYMBOLS / SHA256SUMS）
          E=/tmp/art-engine
          if fetch_to skroot-engine-arm64 "$E"; then
            # 校验材料先落盘/打印（ENGINE-META / SYMBOLS / SHA256SUMS）
            for m in ENGINE-META.txt SYMBOLS-libskrootpatch.txt SHA256SUMS magiskboot-meta.txt; do
              f=$(find "$E" -name "$m" | head -1)
              if [ -n "${f:-}" ]; then echo "--- $m ---"; cat "$f"; cp -f "$f" "$ASSETS/" 2>/dev/null || true; fi
            done
            # 选择 JNI 共享库：优先带 Java_ 符号的 .so（无论叫 libskrootpatch.so 还是旧名 libskpatchjni.so）
            JNI_SRC=""
            for f in $(find "$E" -type f -name '*.so'); do
              if command -v nm >/dev/null 2>&1 && nm -D --defined-only "$f" 2>/dev/null | grep -q "Java_me_sproot_patch_NativeEngine"; then
                JNI_SRC="$f"; break
              fi
            done
            if [ -z "$JNI_SRC" ]; then
              # 新命名规范：直接是 libskrootpatch.so（ET_DYN），无 nm 时按名字取
              JNI_SRC=$(find "$E" -type f -name 'libskrootpatch.so' | head -1)
            fi
            if [ -n "${JNI_SRC:-}" ]; then
              cp -f "$JNI_SRC" "$DEST/libskrootpatch.so"
              echo "JNI_ENGINE_SRC=$JNI_SRC"
            else
              echo "::warning::engine artifact 中未找到 JNI 引擎库"
            fi
            find "$E" -name 'magiskboot' -exec cp -f {} "$DEST/libmagiskboot.so" \; 2>/dev/null || true
            # 裸名 CLI（skroot-patch）绝不进 jniLibs（ET_EXEC 混入 lib*.so 会被误当库）
          fi
          # 兼容：若 patcher 单独发布 magiskboot artifact
          if [ ! -f "$DEST/libmagiskboot.so" ]; then
            M=/tmp/art-magiskboot
            if fetch_to magiskboot-arm64 "$M"; then
              f=$(find "$M" -type f \( -name 'magiskboot' -o -name 'libmagiskboot.so' \) | head -1)
              [ -n "${f:-}" ] && cp -f "$f" "$DEST/libmagiskboot.so"
              find "$M" -name '*meta*.txt' -exec cp -f {} "$ASSETS/" \; 2>/dev/null || true
            fi
          fi

          # 2) AP 守护（sys-guard：libapd-arm64.so + apd-version.txt）
          A=/tmp/art-apd
          if fetch_to apd-aarch64-latest "$A"; then
            f=$(find "$A" -type f -name 'libapd*.so' | head -1)
            [ -n "${f:-}" ] && cp -f "$f" "$DEST/libapd.so"
            find "$A" -name 'apd-version.txt' -exec cp -f {} "$ASSETS/" \; 2>/dev/null || true
          fi

          echo "--- jniLibs ---"; ls -la "$DEST" || true
          for f in "$DEST"/*.so; do
            [ -f "$f" ] || continue
            file "$f" || true
            MACHINE=$(od -An -tu2 -j18 -N2 "$f" | tr -d ' ')
            echo "ELF machine=$MACHINE ($(basename "$f"))"
            if [ "$MACHINE" != "183" ]; then echo "::warning::$(basename "$f") 不是 AArch64 ELF (machine=$MACHINE)"; fi
          done
          if [ -f "$DEST/libmagiskboot.so" ]; then
            sha256sum "$DEST/libmagiskboot.so" || true
            echo "MAGISKBOOT_PRESENT=1" >> "$GITHUB_ENV"
          fi
          if [ -f "$DEST/libskrootpatch.so" ]; then echo "ENGINE_PRESENT=1" >> "$GITHUB_ENV"; fi
          if [ -f "$DEST/libapd.so" ]; then echo "APD_PRESENT=1" >> "$GITHUB_ENV"; fi

      - name: Assemble NOTICE assets (single source of truth)
        run: |
          set -eu
          A=app/src/main/assets
          mkdir -p "$A/licenses"
          {
            echo "# SPRoot Manager APK — 第三方声明（与仓库根 NOTICE 同源）"
            echo
            cat NOTICE
            echo
            echo "---"
            echo
            cat "$A/NOTICE-APK.md"
          } > "$A/NOTICE"
          cp -f LICENSE "$A/licenses/AGPL-3.0.txt"
          cp -f "$A/licenses/AGPL-3.0.txt" "$A/licenses/LICENSE"
          cp -f "$A/NOTICE" "$A/licenses/NOTICE"
          # 发布门禁要求的必备字样自检（缺一即构建失败）
          NOTICE_FILE="$A/NOTICE"
          for phrase in "SKRoot" "All Rights Reserved" "保留所有权利" "AGPL-3.0" "GPL-3.0" "magiskboot" "asmjit" "capstone" "cJSON"; do
            if grep -q "$phrase" "$NOTICE_FILE"; then
              echo "NOTICE phrase OK: $phrase"
            else
              echo "::error::NOTICE 缺少必备声明字样：$phrase"; exit 1
            fi
          done
          echo "--- assets ---"; ls -la "$A" "$A/licenses"
          echo "NOTICE bytes=$(stat -c %s "$A/NOTICE")"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -20

      - name: Inspect APK native libs (info only)
        if: always()
        run: |
          unzip -l app/build/outputs/apk/release/*.apk | grep -E "lib/arm64-v8a|extractNativeLibs" || true
          unzip -l app/build/outputs/apk/release/*.apk | grep "lib/arm64-v8a" || echo "WARN: APK 内暂无 jniLibs（等 engine/apd artifact 就绪）"

      - name: Assert APK contains required AArch64 natives
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a" || true
          MISSING=0
          for lib in libskrootpatch.so libmagiskboot.so libapd.so; do
            if unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib"; then
              unzip -p "$APK" "lib/arm64-v8a/$lib" > "/tmp/$lib"
              MACHINE=$(od -An -tu2 -j18 -N2 "/tmp/$lib" | tr -d ' ')
              SIZE=$(stat -c %s "/tmp/$lib")
              SHA=$(sha256sum "/tmp/$lib" | cut -d' ' -f1)
              echo "OK $lib  size=$SIZE  sha256=$SHA  elf_machine=$MACHINE"
              if [ "$MACHINE" != "183" ]; then echo "::error::$lib 不是 AArch64 ELF"; exit 1; fi
            else
              echo "::error::APK 缺少 lib/arm64-v8a/$lib（native 集成未完成，禁止出包）"
              MISSING=1
            fi
          done
          if [ "$MISSING" != "0" ]; then exit 1; fi
          # libskrootpatch.so 必须是 JNI 共享库（ET_DYN），不能是 CLI 可执行文件
          if file /tmp/libskrootpatch.so | grep -q "shared object"; then
            echo "OK libskrootpatch.so is a shared object (ET_DYN)"
          else
            echo "::error::libskrootpatch.so 不是共享库（可能误放 CLI 可执行文件）"; exit 1
          fi
          # JNI ABI 断言：必须导出 me.sproot.patch.NativeEngine 的两个符号
          if command -v nm >/dev/null 2>&1; then
            if nm -D --defined-only /tmp/libskrootpatch.so | grep -q "Java_me_sproot_patch_NativeEngine_patch"; then
              echo "OK JNI symbol patch"
            else
              echo "::error::libskrootpatch.so 缺少 Java_me_sproot_patch_NativeEngine_patch"; exit 1
            fi
            if nm -D --defined-only /tmp/libskrootpatch.so | grep -q "Java_me_sproot_patch_NativeEngine_engineVersion"; then
              echo "OK JNI symbol engineVersion"
            else
              echo "::error::libskrootpatch.so 缺少 Java_me_sproot_patch_NativeEngine_engineVersion"; exit 1
            fi
          else
            echo "::warning::nm 不可用，跳过 JNI 符号断言"
          fi
          # 作废旧名不得出现在 APK
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libskpatchjni.so"; then
            echo "::error::APK 内出现已作废的 libskpatchjni.so"; exit 1
          fi
          # NOTICE / 许可证断言：第三方声明与 GPL-3.0、AGPL-3.0 全文必须随包
          for asset in assets/NOTICE assets/licenses/NOTICE assets/licenses/LICENSE assets/licenses/GPL-3.0.txt assets/licenses/AGPL-3.0.txt assets/NOTICE-APK.md; do
            if unzip -l "$APK" | grep -q "$asset"; then
              echo "OK $asset present"
            else
              echo "::error::APK 缺少 $asset（第三方声明/许可证文本缺失）"; exit 1
            fi
          done
          NOTICE_TMP=/tmp/notice-from-apk.txt
          unzip -p "$APK" assets/NOTICE > "$NOTICE_TMP"
          for phrase in "SKRoot" "All Rights Reserved" "AGPL-3.0" "GPL-3.0" "magiskboot"; do
            grep -q "$phrase" "$NOTICE_TMP" \
              && echo "OK NOTICE(from APK) contains: $phrase" \
              || { echo "::error::APK 的 assets/NOTICE 缺少字样：$phrase"; exit 1; }
          done
          # AGPL-3.0 全文断言（LICENSE 应显著大于 20KB 且含 AGPL 标题）
          unzip -p "$APK" assets/licenses/LICENSE > /tmp/license-from-apk.txt
          SIZE=$(stat -c %s /tmp/license-from-apk.txt)
          [ "$SIZE" -gt 20000 ] && echo "OK AGPL full text size=$SIZE" \
            || { echo "::error::assets/licenses/LICENSE 过小（$SIZE B），疑似非全文"; exit 1; }
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" /tmp/license-from-apk.txt \
            && echo "OK AGPL header present" \
            || { echo "::error::LICENSE 缺 AGPL 标题"; exit 1; }
          # extractNativeLibs 断言（Android 需解压 nativeLibraryDir 才能 exec magiskboot/apd）
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i "extractNativeLibs" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPRoot-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
